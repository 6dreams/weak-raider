project:
  name: Weak Raider
  port: 8080
  debug: true
  environment: development

database:
  sslmode: disable
  migrations: migrations
  driver: pgx
  connections:
    maxOpenCons: 5
    maxIdleCons: 5
    connMaxIdleTime: 5m
    connMaxLifeTime: 5m

jobs:
  default: 1h
  dict_seasons:
    period: 24h
  dict_instances:
    period: 24h
  characters:
    period: 24h
  dict_talents:
    period: 24h
